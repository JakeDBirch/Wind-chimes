<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0c0e">
<title>Chimes Physics</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0b0c0e; color: #c8d0c8; font-family: 'Courier New', monospace; font-size: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.app { padding: 18px; padding-top: calc(18px + env(safe-area-inset-top)); padding-left: calc(18px + env(safe-area-inset-left)); padding-right: calc(18px + env(safe-area-inset-right)); padding-bottom: calc(100px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; }
h1 { font-size: 11px; letter-spacing: 0.28em; color: #7ac89a; margin-bottom: 3px; text-transform: uppercase; }
.sub { font-size: 9px; color: #304838; letter-spacing: 0.15em; margin-bottom: 14px; }
canvas { display: block; width: 100%; height: 340px; background: #0e1210; border: 1px solid #1a2a1e; border-radius: 6px; margin-bottom: 14px; }
.section { margin-bottom: 16px; border-left: 1px solid #1a2a1e; padding-left: 12px; }
.stitle { font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase; color: #7ac89a; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.label { width: 130px; flex-shrink: 0; font-size: 9px; color: #4a7058; }
.val { width: 48px; text-align: right; flex-shrink: 0; font-size: 10px; color: #7ac89a; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; -webkit-appearance: none; height: 2px; background: #1a2a1e; border-radius: 1px; outline: none; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #0b0c0e; border: 1.5px solid #7ac89a; }
.schip { padding: 4px 9px; border-radius: 4px; border: 1px solid #1e2e22; background: none; color: #4a7060; font-family: 'Courier New', monospace; font-size: 9px; cursor: pointer; outline: none; transition: all 0.15s; letter-spacing: 0.05em; }
.schip.active { border-color: #7ac89a; color: #7ac89a; background: rgba(122,200,154,0.08); }
.float-bar { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(11,12,14,0.96); border: 1px solid #1a2a1e; border-radius: 10px; padding: 10px 14px; z-index: 100; }
.fbtn { padding: 9px 16px; border-radius: 6px; border: 1px solid #7ac89a; background: rgba(122,200,154,0.07); color: #7ac89a; font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 0.16em; cursor: pointer; outline: none; text-transform: uppercase; }
.fbtn:active { opacity: 0.6; }
.fbtn.off { border-color: #c87a7a; color: #c87a7a; background: rgba(200,122,122,0.07); }
/* Source toggle — Wind / Phone segmented */
.seg { display: flex; border: 1px solid #2a3a2e; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.seg button { flex: 1; padding: 10px 0; background: none; border: none; color: #5a6a5e; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; outline: none; transition: 0.18s; }
.seg button.active { background: rgba(122,200,154,0.14); color: #aee3c4; }
.seg button:first-child { border-right: 1px solid #2a3a2e; }
.motion-status { font-size: 8px; letter-spacing: 0.08em; color: #556; margin-bottom: 4px; min-height: 11px; }
.readouts { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 9px; color: #304838; }
.readouts span { color: #7ac89a; }
</style>
</head>
<body>
<div class="app">
  <h1>Chimes Physics Sandbox</h1>
  <div class="sub">2D pendulum system — top-down view</div>

  <canvas id="viz" width="680" height="680"></canvas>

  <div class="readouts">
    <div>ring x <span id="r-rx">0.00</span></div>
    <div>ring y <span id="r-ry">0.00</span></div>
    <div>wind <span id="r-wind">0.00</span></div>
    <div>strikes <span id="r-strikes">0</span></div>
  </div>

  <div class="section">
    <div class="stitle">Physical parameters</div>
    <div class="row">
      <span class="label">Cord length</span>
      <input type="range" id="cordLength" min="0.3" max="0.8" step="0.005" value="0.53">
      <span class="val" id="v-cordLength">0.53</span>
    </div>
    <div class="row">
      <span class="label">Damping</span>
      <input type="range" id="damping" min="1" max="100" step="1" value="43">
      <span class="val" id="v-damping">0.0038</span>
    </div>
    <div class="row">
      <span class="label">Gap</span>
      <input type="range" id="gap" min="10" max="22" step="0.1" value="15.25">
      <span class="val" id="v-gap">15.3</span>
    </div>
<div class="row">
      <span class="label">Tubes</span>
      <input type="range" id="tubeCount" min="3" max="8" step="1" value="6">
      <span class="val" id="v-tubeCount">6</span>
    </div>
  </div>
  <div class="section">
    <div class="stitle">Sound</div>
    <div class="row">
      <span class="label">Material</span>
    </div>
    <div id="material-chips" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;"></div>
    <div class="row">
      <span class="label">Scale</span>
    </div>
    <div id="scale-chips" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;"></div>
    <div class="row">
      <span class="label">Register</span>
      <input type="range" id="register" min="-1" max="1" step="0.1" value="0">
      <span class="val" id="v-register">0</span>
    </div>
  </div>
  <div class="section">
    <div class="stitle">Drive</div>
    <div class="seg">
      <button id="src-wind" class="active">Wind</button>
      <button id="src-phone">Phone</button>
    </div>
    <div class="motion-status" id="motion-status"></div>
    <div class="row">
      <span class="label">Strength</span>
      <input type="range" id="windStrength" min="0.10" max="0.50" step="0.005" value="0.3">
      <span class="val" id="v-windStrength">0.30</span>
    </div>
    <div class="row">
      <span class="label">Susceptibility</span>
      <input type="range" id="windSusc" min="0.1" max="2.0" step="0.05" value="0.5">
      <span class="val" id="v-windSusc">0.50</span>
    </div>
    <div class="row">
      <span class="label">Steadiness</span>
      <input type="range" id="windSteady" min="0" max="0.35" step="0.005" value="0.10">
      <span class="val" id="v-windSteady">0.50</span>
    </div>
    <div class="row">
      <span class="label">Turbulence</span>
      <input type="range" id="windTurb" min="0.10" max="0.50" step="0.005" value="0.28">
      <span class="val" id="v-windTurb">0.20</span>
    </div>
  </div>
</div>

<div class="float-bar">
  <button class="fbtn off" id="btn-physics">Physics off</button>
  <button class="fbtn" id="btn-gust">Gust</button>
</div>

<script>
// ── Helpers ───────────────────────────────────────────────
function gv(id) { return parseFloat(document.getElementById(id).value); }
// Logarithmic damping map: slider 1-100 → 0.0005-0.035
function getDamping() {
  var v = parseFloat(document.getElementById('damping').value) || 18;
  return 0.0015 * Math.pow(6.667, (v - 1) / 99);
}
function sv(id) {
  var n = gv(id), el = document.getElementById('v-' + id);
  if (!el) return;
  if (n < 0.01) el.textContent = n.toFixed(4);
  else if (n < 1) el.textContent = n.toFixed(2);
  else el.textContent = n.toFixed(2);
}
window.addEventListener('load', function() {
  document.getElementById('gap').addEventListener('input', function() {
    var gapM = parseFloat(this.value) / 1000;
    var n = Math.round(gv('tubeCount'));
    ringRadius = (gapM + 2 * TUBE_R) / (2 * Math.sin(Math.PI / n));
    document.getElementById('v-gap').textContent = Math.round(this.value);
  });

  document.querySelectorAll('input[type=range]').forEach(function(el) {
    if (el.id === 'damping') { document.getElementById('v-damping').textContent = getDamping().toFixed(4); } else { sv(el.id); }
    el.addEventListener('input', function() {
      if (el.id === 'damping') { document.getElementById('v-damping').textContent = getDamping().toFixed(4); } else { sv(el.id); }
      // Only fully rebuild when tube count changes — that requires new objects
      // Everything else (damping, lengths, wind, gaps) is read live by tick() each frame
      if (el.id === 'tubeCount') {
        rebuild();
        if (running) { clearInterval(physTimer); physTimer = setInterval(tick, Math.round(DT*1000)); }
      }
      // chimeSpacing changes ring geometry but we can update ringRadius without resetting state
      if (el.id === 'gap') {
        var gapM = (gv('gap') * 0.5) / 1000;
        var n = Math.round(gv('tubeCount'));
        ringRadius = (gapM + 2 * TUBE_R) / (2 * Math.sin(Math.PI / n));
      }
      draw();
    });
  });
  // Build scale chips
  var scaleNames = Object.keys(SCALES);
  var chipsEl = document.getElementById('scale-chips');
  scaleNames.forEach(function(name) {
    var b = document.createElement('button');
    b.className = 'schip' + (name === currentScale ? ' active' : '');
    b.textContent = name;
    b.addEventListener('click', function() {
      currentScale = name;
      chipsEl.querySelectorAll('.schip').forEach(function(c) { c.classList.remove('active'); });
      b.classList.add('active');
      draw();
    });
    chipsEl.appendChild(b);
  });

  // Material chips
  var matChipsEl = document.getElementById('material-chips');
  ['Metal', 'Wood'].forEach(function(name) {
    var b = document.createElement('button');
    b.className = 'schip' + (name === currentMaterial ? ' active' : '');
    b.textContent = name;
    b.addEventListener('click', function() {
      currentMaterial = name;
      matChipsEl.querySelectorAll('.schip').forEach(function(c) { c.classList.remove('active'); });
      b.classList.add('active');
    });
    matChipsEl.appendChild(b);
  });
  document.getElementById('btn-gust').addEventListener('click', function() {
    fireGust();
    if (!physicsOn) setPhysics(true);
  });

  // ── Physics master toggle ──
  document.getElementById('btn-physics').addEventListener('click', function() {
    setPhysics(!physicsOn);
  });

  // ── Source segmented toggle: Wind / Phone ──
  document.getElementById('src-wind').addEventListener('click', function() {
    setSource('wind');
  });
  document.getElementById('src-phone').addEventListener('click', function() {
    setSource('phone'); // triggers permission request
  });

  rebuild();
  requestAnimationFrame(function() { draw(); });
});

// ── Master physics control ────────────────────────────────
function setPhysics(on) {
  physicsOn = on;
  var btn = document.getElementById('btn-physics');
  btn.textContent = on ? 'Physics on' : 'Physics off';
  btn.classList.toggle('off', !on);
  btn.classList.toggle('on', on);
  if (on) {
    // Activate whichever source is selected
    if (source === 'wind') {
      windOn = true;
      _windAngle = Math.random() * Math.PI * 2;
      _windSpeed = 0; _turbX = 0; _turbY = 0; _noiseX = 0; _noiseY = 0;
      _calmDamp = 1.0;
      _scheduleNextEvent();
    }
    if (!running) start();
  } else {
    windOn = false;
    stop();
  }
}

// ── Source selection ──────────────────────────────────────
function setSource(src) {
  var wBtn = document.getElementById('src-wind');
  var pBtn = document.getElementById('src-phone');
  var status = document.getElementById('motion-status');

  if (src === 'wind') {
    // Disable motion
    if (motionOn) {
      window.removeEventListener('devicemotion', onDeviceMotion);
      motionOn = false;
      _motionX = _motionY = _motionRawX = _motionRawY = 0;
    }
    source = 'wind';
    wBtn.classList.add('active'); pBtn.classList.remove('active');
    status.textContent = '';
    if (physicsOn) {
      windOn = true;
      _windAngle = Math.random() * Math.PI * 2;
      _scheduleNextEvent();
    }
  } else {
    // Phone — request motion permission
    function enable() {
      window.addEventListener('devicemotion', onDeviceMotion);
      window._motionEventCount = 0;
      setTimeout(function() {
        if (motionOn && window._motionEventCount === 0)
          status.textContent = 'No data — open in Safari over HTTPS, not embedded.';
      }, 1200);
      motionOn = true;
      windOn = false;
      source = 'phone';
      wBtn.classList.remove('active'); pBtn.classList.add('active');
      status.textContent = 'Active — shake or sway to chime.';
      if (physicsOn && !running) start();
      if (!physicsOn) setPhysics(true);
    }
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      status.textContent = 'Requesting permission…';
      DeviceMotionEvent.requestPermission().then(function(state) {
        if (state === 'granted') enable();
        else status.textContent = 'Denied. Settings > Safari > Motion Access.';
      }).catch(function() {
        status.textContent = 'Failed — needs HTTPS in Safari, not embedded.';
      });
    } else if (typeof DeviceMotionEvent !== 'undefined') {
      enable();
    } else {
      status.textContent = 'Motion not supported here.';
    }
  }
}

// ── Accelerometer handler ─────────────────────────────────
function onDeviceMotion(e) {
  window._motionEventCount = (window._motionEventCount || 0) + 1;
  var acc = e.accelerationIncludingGravity || e.acceleration;
  if (!acc) return;
  _motionRawX = (acc.x || 0);
  _motionRawY = (acc.y || 0);
}

// ── Physics constants ─────────────────────────────────────
var G = 9.81; // m/s²
var DT = 1/120; // physics timestep

// ── State ─────────────────────────────────────────────────
// Ring: 2D pendulum hanging from fixed point
// State: [angX, velX, angY, velY] — X and Y angles from vertical
var ring    = { ax: 0, vx: 0, ay: 0, vy: 0 };
// Striker: separate pendulum from same fixed mount, shorter cord
// Hangs freely — decoupled from ring, has its own inertia
var striker = { ax: 0, vx: 0, ay: 0, vy: 0 };

// Tubes: each is a 2D pendulum hanging from its mount on the ring
// Mount points are evenly spaced around the ring at radius ringRadius
// State per tube: { ax, vx, ay, vy }
var tubes = [];
var ringRadius = 0.187; // gap=150mm, n=5: (0.150+2*0.035)/(2*sin(π/5))
var TUBE_R = 0.035; // tube radius in meters

// Wind state
var windX = 0, windY = 0;
// Master run state and force source
var physicsOn = false;
var source    = 'wind'; // 'wind' | 'phone'
// Accelerometer motion mode
var motionOn   = false;
var _motionX   = 0, _motionY = 0;   // smoothed acceleration → force
var _motionRawX = 0, _motionRawY = 0;
var _motionGain = 1.0;
var windOn = false;
var windTimer = null;
// Wind event model
// Wind is a sequence of discrete events separated by lulls.
// Each event has: intensity (0-1), duration, rise time, fall time, angle.
// Between events: silence with decaying residual.
var _windAngle  = 0;
var _windSpeed  = 0;
var _windMeanX  = 0, _windMeanY = 0;
var _turbX = 0, _turbY = 0;
var _noiseX = 0, _noiseY = 0;
var _calmDamp   = 1.0;

// Current event state
var _evtPhase    = 'lull';  // 'lull' | 'rise' | 'hold' | 'fall'
var _evtT        = 0;       // time in current phase
var _evtLullDur  = 35.0;    // initial lull
var _evtRiseDur  = 0;
var _evtHoldDur  = 0;
var _evtFallDur  = 0;
var _evtPeak     = 0;       // target intensity for this event
var _evtAngle    = 0;

function _scheduleNextEvent() {
  // Lull: 20–80s
  _evtLullDur = 20 + Math.random() * 60;
  // Event intensity: weighted toward lighter events
  _evtPeak    = 0.2 + Math.pow(Math.random(), 1.8) * 0.8;
  // Rise: 1–6s (stronger events rise faster)
  _evtRiseDur = 0.8 + (1 - _evtPeak) * 5 + Math.random() * 2;
  // Hold: 2–12s
  _evtHoldDur = 2 + Math.random() * 10;
  // Fall: 2–10s (can be abrupt or gradual)
  _evtFallDur = 1.5 + Math.random() * 8.5;
  // New angle each event — random drift from previous
  _evtAngle   = _windAngle + (Math.random() - 0.5) * Math.PI * 0.6;
  _evtPhase   = 'lull';
  _evtT       = 0;
}
_scheduleNextEvent();

// Strike tracking
var strikeCount = 0;
var strikeFlash = []; // per tube

var running = false;
var physTimer = null;

function rebuild() {
  var n = Math.round(gv('tubeCount'));
  var gapM = (gv('gap') * 0.5) / 1000;
  ringRadius = (gapM + 2 * TUBE_R) / (2 * Math.sin(Math.PI / n));
  tubes = [];
  strikeFlash = [];
  for (var i = 0; i < n; i++) {
    // Physical tube length derived from pitch: f = K/L^2 => L ∝ 1/sqrt(f)
    // Longer (lower) tubes are heavier — mass ∝ length ∝ 1/sqrt(f)
    var freq = getTubeFreq(i, n);
    var freqRef = getTubeFreq(Math.floor(n/2), n); // middle tube = reference
    var lenVariation = Math.sqrt(freqRef / freq); // longer for lower pitch
    var massVariation = lenVariation;             // mass ∝ length (same diameter)
    tubes.push({ ta: 0, tv: 0, tt: 0, tv_t: 0, lenFactor: lenVariation, mass: massVariation, lastStrike: 0 });
    strikeFlash.push(0);
  }
  ring    = { ax: 0, vx: 0, ay: 0, vy: 0 };
  striker = { ax: 0, vx: 0, ay: 0, vy: 0 };
}

// ── Physics tick ──────────────────────────────────────────
function tick() {
  var ringL  = (gv('cordLength') * 0.30);
  var ringD  = getDamping();
  var tubeL  = gv('cordLength');
  var tubeD  = (getDamping() * 0.67);
  var n      = tubes.length;

  // ── Ring (housing) pendulum — top-down 2D ────────────────
  // Ring only feels wind variation, not mean — prevents DC drift
  var wSusc = gv('windSusc');
  var ringWindX = ((windX - _windMeanX) * 0.75 + _windMeanX * 0.08) * wSusc;
  var ringWindY = ((windY - _windMeanY) * 0.75 + _windMeanY * 0.08) * wSusc;
  var ringAx = -(G / ringL) * Math.sin(ring.ax) + ringWindX / ringL;
  var ringAy = -(G / ringL) * Math.sin(ring.ay) + ringWindY / ringL;
  ring.vx += ringAx * DT; ring.vy += ringAy * DT;
  ring.vx *= (1 - ringD * _calmDamp); ring.vy *= (1 - ringD * _calmDamp);
  ring.ax += ring.vx * DT; ring.ay += ring.vy * DT;
  ring.ax = Math.max(-Math.PI/2, Math.min(Math.PI/2, ring.ax));
  ring.ay = Math.max(-Math.PI/2, Math.min(Math.PI/2, ring.ay));
  var rcx = Math.sin(ring.ax) * ringL;
  var rcy = Math.sin(ring.ay) * ringL;

  // ── Clapper disc — longer cord than tubes, strikes at tube midpoint ──
  // Disc is heavier/larger than tubes so has more wind exposure.
  // Cord longer than tubes so disc hangs below tube midpoints — strikes there.
  // In top-down view: clapper swings in 2D from ring center.
  var strikerL = (gv('cordLength') * 0.76);
  var clapperD = (getDamping() * 1.67);
  var sEnergy  = striker.vx*striker.vx + striker.vy*striker.vy
               + (striker.ax*striker.ax + striker.ay*striker.ay) * 0.15;
  var sDamp    = clapperD * (1 + sEnergy * 25);
  sDamp = Math.min(0.10, sDamp);

  // Clapper hangs inside the ring — sheltered from steady wind.
  // Only catches gusts/turbulence, not the mean flow.
  // Wind coupling is low so gravity always wins at equilibrium — clapper returns to center.
  // Clapper is sheltered — only feels turbulent variation, not mean flow
  var clapperWindX = (windX - _windMeanX) * 0.55 * wSusc;
  var clapperWindY = (windY - _windMeanY) * 0.55 * wSusc;
  var sAccX = -(G / strikerL) * Math.sin(striker.ax) + clapperWindX / strikerL;
  var sAccY = -(G / strikerL) * Math.sin(striker.ay) + clapperWindY / strikerL;
  striker.vx += sAccX * DT; striker.vy += sAccY * DT;
  striker.vx *= (1 - sDamp * _calmDamp); striker.vy *= (1 - sDamp * _calmDamp);
  striker.ax += striker.vx * DT; striker.ay += striker.vy * DT;
  striker.ax = Math.max(-Math.PI/2, Math.min(Math.PI/2, striker.ax));
  striker.ay = Math.max(-Math.PI/2, Math.min(Math.PI/2, striker.ay));
  // Clapper disc world position — hangs from ring center
  var scx = rcx + Math.sin(striker.ax) * strikerL;
  var scy = rcy + Math.sin(striker.ay) * strikerL;
  var CLAPPER_R = Math.max(0.005, ringRadius - TUBE_R - (gv('gap') / 1000));

  // ── Tubes — top-down ring, each swings radially (inward/outward) ──
  var now = Date.now();
  for (var i = 0; i < n; i++) {
    var t    = tubes[i];
    var tLen = tubeL * t.lenFactor;
    var tubeMass = t.mass || 1.0;

    var mountAngle = (i / n) * Math.PI * 2;
    var mx = rcx + Math.cos(mountAngle) * ringRadius;
    var my = rcy + Math.sin(mountAngle) * ringRadius;

    // Radial and tangential axes for this mount point
    var radX = -Math.cos(mountAngle), radY = -Math.sin(mountAngle);
    var tanX = -Math.sin(mountAngle), tanY =  Math.cos(mountAngle);

    // Tubes sheltered similarly — AC component only
    var tubeWindX = ((windX - _windMeanX) * 0.85 + _windMeanX * 0.06) * wSusc;
    var tubeWindY = ((windY - _windMeanY) * 0.85 + _windMeanY * 0.06) * wSusc;
    var windR = tubeWindX * radX + tubeWindY * radY;
    var windT = tubeWindX * tanX + tubeWindY * tanY;

    var ringAccX = ring.vx * 35, ringAccY = ring.vy * 35;
    var ringCoupR = (ringAccX * radX + ringAccY * radY) * 0.15;
    var ringCoupT = (ringAccX * tanX + ringAccY * tanY) * 0.15;

    // Radial DOF
    var taccR = -(G / tLen) * Math.sin(t.ta) + windR * 0.24 / (tLen * tubeMass) - ringCoupR / tLen;
    t.tv += taccR * DT;
    var eR = t.tv*t.tv + t.ta*t.ta*0.15;
    t.tv   *= (1 - Math.min(0.18, tubeD * _calmDamp * (1 + eR * 25)));
    t.ta   += t.tv * DT;
    t.ta    = Math.max(-Math.PI/2, Math.min(Math.PI/2, t.ta));

    // Tangential DOF — side-to-side along ring circumference
    var taccT = -(G / tLen) * Math.sin(t.tt) + windT * 0.24 / (tLen * tubeMass) - ringCoupT / tLen;
    t.tv_t += taccT * DT;

    var midX = mx + Math.sin(t.ta)*(tLen*0.5)*radX + Math.sin(t.tt)*(tLen*0.5)*tanX;
    var midY = my + Math.sin(t.ta)*(tLen*0.5)*radY + Math.sin(t.tt)*(tLen*0.5)*tanY;

    var cdx = midX - scx, cdy = midY - scy;
    var cDist = Math.sqrt(cdx*cdx + cdy*cdy);

    var timeSince = now - (t.lastStrike || 0);

    if (cDist < cStrikeDist && cDist > 0.0001 && timeSince > 150) {

      var cnx = cdx / cDist, cny = cdy / cDist;

      // Linear velocities at contact

      var tvy = t.tv*(tLen*0.5)*radY + t.tv_t*(tLen*0.5)*tanY;
      var cvx = striker.vx * strikerL;
      var cvy = striker.vy * strikerL;

      var relVn = (cvx - tvx)*cnx + (cvy - tvy)*cny;

    var mAng2 = (ii / n) * Math.PI * 2;

      y:   my2 + Math.sin(tt.ta)*tL*rY2 + Math.sin(tt.tt)*tL*tY2,

      vy:  tt.tv*tL*rY2 + tt.tv_t*tL*tY2,

        // Project impulse onto both DOF for each tube

        tubes[b].tv   += (impulse*nx*pb.rX + impulse*ny*pb.rY) / (mB * pb.len);
        tubes[b].tv_t += (impulse*nx*pb.tX + impulse*ny*pb.tY) / (mB * pb.len);
        pa.vx = tubes[a].tv*pa.len*pa.rX + tubes[a].tv_t*pa.len*pa.tX;
        pa.vy = tubes[a].tv*pa.len*pa.rY + tubes[a].tv_t*pa.len*pa.tY;
        pb.vx = tubes[b].tv*pb.len*pb.rX + tubes[b].tv_t*pb.len*pb.tX;

  if (windOn) {

    var wSteady = gv('windSteady');
    var wTurb = gv('windTurb');

    var fy = (_motionY - window._mBaseY) * _motionGain;

    windY =  fy * 0.5;

    _windMeanY *= 0.9;

    windX *= 0.97;
    windY *= 0.97;
    _windMeanX *= 0.97;
    _windMeanY *= 0.97;

  // Update readouts
  // Advance chord progression
  if (currentScale === 'Chord Seq' && running) {
    _chordTimer += DT;
    if (_chordTimer >= CHORD_DUR) {
      _chordTimer = 0;
      _chordIdx = (_chordIdx + 1) % CHORD_PROG.length;
    }
  }

  document.getElementById('r-rx').textContent = rcx.toFixed(3);
  document.getElementById('r-ry').textContent = rcy.toFixed(3);
  document.getElementById('r-wind').textContent = Math.sqrt(windX*windX+windY*windY).toFixed(3);

  draw();
}


// ── Audio ──────────────────────────────────────────────────
var audioCtx = null;
var sbMasterOut = null;




function getAudio() {
  if (audioCtx) return audioCtx;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  sbMasterOut = audioCtx.createGain();
  sbMasterOut.gain.value = 0.9;
  sbMasterOut.connect(audioCtx.destination);

  // Dry only — no reverb

  return audioCtx;
}

// Tube frequencies — pentatonic scale rooted at A4
// Length-derived: lower tubes = lower pitch
var SCALES = {
  'Pentatonic':  [0, 3, 5, 7, 10],
  'Chord Seq':   [0, 3, 5, 7, 10],  // placeholder — sequenced in getTubeFreq
};
var currentScale = 'Chord Seq';
var currentMaterial = 'Metal';

// Chord progression for 'Chord Seq' mode
// Each chord is a set of semitone offsets from root
var CHORD_PROG = [
  [0, 3, 7, 10, 14, 17],    // im9add11 — tonic, open and floating
  [5, 8, 12, 15, 19, 22],   // iv9 — subdominant with ninth and eleventh
  [2, 5, 9, 12, 16, 21],    // II maj9 — bright borrowed chord
  [7, 10, 14, 17, 21, 24],  // v11 — dominant suspended, unresolved
  [3, 7, 10, 14, 17, 22],   // IIImaj9 — warm mediant
  [8, 12, 15, 19, 22, 26],  // VI9 — relative major with extensions
];
var _chordIdx   = 0;
var _chordTimer = 0;
var CHORD_DUR   = 20.0; // seconds per chord

function getTubeFreq(idx, n) {
  var reg = parseFloat(document.getElementById('register').value) || 0;
  var semitone;
  if (currentScale === 'Chord Seq') {
    var chord = CHORD_PROG[_chordIdx % CHORD_PROG.length];
    semitone = chord[idx % chord.length] + Math.floor(idx / chord.length) * 12;
  } else {
    var sc = SCALES[currentScale] || SCALES['Pentatonic'];
    semitone = sc[idx % sc.length] + Math.floor(idx / sc.length) * 12;
  }
  return 440 * Math.pow(2, (semitone + reg * 12) / 12);
}

// Metal tube partials — inharmonic series characteristic of hollow metal cylinders
var METAL_PARTIAL_RATIOS = [1, 2.756, 5.404, 8.933];
var METAL_PARTIAL_GAINS  = [1.0, 0.55, 0.28, 0.10];
var METAL_PARTIAL_DECAYS = [1.0, 0.55, 0.30, 0.15];

// Wood chime partials — shorter, darker, clustered inharmonics

// Wood partials — free bar modes with a near-fundamental doublet for beating
// Ratio 1.015 creates a beat tone against fundamental (~1.5% sharp clone)
var WOOD_PARTIAL_RATIOS  = [1, 1.015, 1.67, 2.76, 4.47];

var WOOD_PARTIAL_DECAYS  = [1.0, 0.80, 0.58, 0.26, 0.10];

  var freq   = getTubeFreq(idx, n);
  var velNorm = Math.min(1.0, velocity);

  var PARTIAL_RATIOS = isWood ? WOOD_PARTIAL_RATIOS : METAL_PARTIAL_RATIOS;
  var PARTIAL_GAINS  = isWood ? WOOD_PARTIAL_GAINS  : METAL_PARTIAL_GAINS;
  var PARTIAL_DECAYS = isWood ? WOOD_PARTIAL_DECAYS : METAL_PARTIAL_DECAYS;

    partialRolloff = isClapper ? 0.80 : 0.50;

    decayMult      = isClapper ? 0.55 : 0.35;

      // Strong mid-frequency thud, pronounced fundamental knock, very little scrape

      // Sub knock
      var subOsc = ctx.createOscillator();
      subOsc.type = 'sine';
      subOsc.frequency.value = freq * 0.52;
      var subEnv = ctx.createGain();
      subEnv.gain.setValueAtTime(vel * (0.22 + velNorm * 0.90), noiseNow);
      subEnv.gain.exponentialRampToValueAtTime(0.0001, noiseNow + 0.04 + velNorm * 0.06);
      subOsc.connect(subEnv); subEnv.connect(sbMasterOut);
      subOsc.start(noiseNow); subOsc.stop(noiseNow + 0.12);

      // Mid-body knock
      var midOsc = ctx.createOscillator();
      midOsc.type = 'sine';
      midOsc.frequency.value = freq * (0.83 + (Math.random() - 0.5) * 0.06);
      var midEnv = ctx.createGain();
      midEnv.gain.setValueAtTime(vel * (0.18 + velNorm * 0.60), noiseNow);
      midEnv.gain.exponentialRampToValueAtTime(0.0001, noiseNow + 0.025 + velNorm * 0.03);
      midOsc.connect(midEnv); midEnv.connect(sbMasterOut);
      midOsc.start(noiseNow); midOsc.stop(noiseNow + 0.08);
    }

  }

  var pitchWobble = 1 + (Math.random() - 0.5) * (isWood ? 0.012 : 0.001) * (1 - velNorm * 0.5);
  var now = ctx.currentTime + 0.006;

  PARTIAL_RATIOS.forEach(function(ratio, i) {
    // Wood: scatter upper partial ratios per strike — anharmonic character
    var scatteredRatio = ratio;
    if (isWood && i > 0) {
      // i=1 (doublet): small scatter keeps beating natural
      // i=2+: wider scatter for genuine inharmonic character
      var scatterAmt = i === 1 ? 0.008 : 0.10 * i;
      scatteredRatio = ratio * (1 + (Math.random() - 0.5) * scatterAmt);
    }
    var pFreq = freq * scatteredRatio * pitchWobble;
    if (pFreq > 16000) return;

    // Higher partials only emerge on harder strikes
    var partialVelThresh = isWood ? i * 0.30 : i * 0.12;
    if (velNorm < partialVelThresh) return;
    var partialVel = Math.max(0, (velNorm - partialVelThresh) / (1 - partialVelThresh));

    var detuneCents = (Math.random() - 0.5) * (isWood ? (i === 0 ? 8 : 20) : 4);
    var pFreqD = pFreq * Math.pow(2, detuneCents / 1200);

    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = pFreqD;

    var decayVar = isWood ? (0.80 + Math.random() * 0.40) : 1.0;
    var pDecay = baseDecay * PARTIAL_DECAYS[i] * decayVar;
    // partialRolloff dims upper partials for tube-on-tube (warmer tone)
    var gainVar = isWood ? (0.75 + Math.random() * 0.50) : (0.90 + Math.random() * 0.20);
    var pGain  = vel * PARTIAL_GAINS[i] * gainVar * Math.pow(partialRolloff, i) * Math.pow(partialVel, 0.6) * 0.65;

    // attackMult slows the transient for glancing tube-on-tube strikes
    // Low vel = rounder attack; high vel = sharp transient
    var velAttack = isWood ? (0.018 - velNorm * 0.014) : 0.006; // 18ms→4ms as vel rises
    var attack = attackMult * (velAttack + i * (0.006 + velNorm * 0.008));

    // Filter: static cutoff for wood (sweep reads as pitch bend), sweep for metal
    var filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.Q.value = 0.5;
    if (isWood) {
      // Static cutoff — velocity sets brightness but no time-based movement
      filt.frequency.value = pFreq * (endCutoffMult + velNorm * (startCutoffMult - endCutoffMult) * 0.4);
    } else {
      var startCutoff = pFreq * startCutoffMult;
      var endCutoff   = pFreq * endCutoffMult;
      filt.frequency.setValueAtTime(startCutoff, now + attack);
      filt.frequency.exponentialRampToValueAtTime(endCutoff, now + attack + pDecay);
    }

    var env = ctx.createGain();
    env.gain.setValueAtTime(0, now);
    env.gain.linearRampToValueAtTime(pGain, now + attack);

    if (isWood) {
      // Two-stage release:
      // Stage 1 — fast dump to tail level
      // Stage 2 — RC-curve tail (setTargetAtTime): steepest drop early, gentle approach to silence
      var dumpFrac  = 0.32 + velNorm * 0.38;
      var dumpTime  = pDecay * (0.12 + velNorm * 0.08);
      var tailLevel = pGain * (1 - dumpFrac);
      var tailTime  = pDecay * (0.90 - velNorm * 0.48 + Math.random() * 0.12);
      // timeConstant = tailTime/3 so we reach ~95% silence in tailTime
      var tailTC    = tailTime / 5.5;
      env.gain.exponentialRampToValueAtTime(Math.max(0.0001, tailLevel), now + attack + dumpTime);
      env.gain.setTargetAtTime(0.0001, now + attack + dumpTime, tailTC);
      osc.start(now); osc.stop(now + attack + dumpTime + tailTime + 0.1);
    } else {
      env.gain.exponentialRampToValueAtTime(0.0001, now + attack + pDecay);
      osc.start(now); osc.stop(now + attack + pDecay + 0.1);
    }

    if (isWood) {
      // A. Detuned ghost — subtle beating against fundamental
      //    Different detune per partial so each mode beats at its own rate
      var ghostOsc = ctx.createOscillator();
      ghostOsc.type = 'sine';
      var ghostDetune = (Math.random() - 0.5) * 0.022 * (1 + i * 0.5);
      ghostOsc.frequency.value = pFreqD * (1 + ghostDetune);
      var ghostEnv = ctx.createGain();
      ghostEnv.gain.setValueAtTime(0, now);
      ghostEnv.gain.linearRampToValueAtTime(pGain * 0.22, now + attack);
      ghostEnv.gain.setTargetAtTime(0.0001, now + attack, (tailTime || pDecay) / 4);
      ghostOsc.connect(filt); filt.connect(ghostEnv); ghostEnv.connect(sbMasterOut);
      ghostOsc.start(now); ghostOsc.stop(now + attack + (tailTime || pDecay) + 0.1);

      // B. Per-partial frequency drift in tail — material settling
      //    Tiny slow glide away from start frequency, different per partial
      var driftAmt  = pFreqD * (Math.random() - 0.5) * 0.003;
      var driftTime = (tailTime || pDecay) * (0.3 + Math.random() * 0.5);
      osc.frequency.setValueAtTime(pFreqD, now + attack);
      osc.frequency.linearRampToValueAtTime(pFreqD + driftAmt, now + attack + driftTime);

      // C. Mode coupling — partial 1 amplitude flutter keyed to partial 0 decay
      //    Simulates energy exchange between modes
      if (i === 1) {
        var flutterRate = 2.5 + Math.random() * 4.0; // 2.5–6.5 Hz flutter
        var flutterOsc  = ctx.createOscillator();
        flutterOsc.type = 'sine';
        flutterOsc.frequency.value = flutterRate;
        var flutterDepth = ctx.createGain();
        flutterDepth.gain.value = pGain * 0.08;
        var flutterEnv = ctx.createGain();
        flutterEnv.gain.setValueAtTime(1.0, now + attack);
        flutterEnv.gain.setTargetAtTime(0.0001, now + attack, (tailTime || pDecay) / 3.5);
        flutterOsc.connect(flutterDepth);
        flutterDepth.connect(flutterEnv);
        flutterEnv.connect(env.gain); // modulates the partial's amplitude
        flutterOsc.start(now); flutterOsc.stop(now + attack + (tailTime || pDecay) + 0.1);
      }
    }
    osc.connect(filt); filt.connect(env);
    env.connect(sbMasterOut);
  });

  // Strike noise removed — click came from here
}

// ── Wind ──────────────────────────────────────────────────
function fireGust() {
  // Single gust: a burst in current wind direction or random if wind off
  var str = gv('windStrength') || 1.0;
  var ang = windOn ? _windAngle : Math.random() * Math.PI * 2;
  var gustStr = str * (1.5 + Math.random());
  windX = Math.cos(ang) * gustStr;
  windY = Math.sin(ang) * gustStr;
  if (!windOn && !running) start();
}

// ── Drawing ───────────────────────────────────────────────
function draw() {
  var canvas = document.getElementById('viz');
  var c = canvas.getContext('2d');
  var W = canvas.offsetWidth  > 0 ? canvas.offsetWidth  : canvas.parentElement.offsetWidth || 340;
  var H = canvas.offsetHeight > 0 ? canvas.offsetHeight : 340;
  canvas.width  = W;
  canvas.height = H;

  c.fillStyle = '#0e1210';
  c.fillRect(0, 0, W, H);

  var n = tubes.length;
  if (n === 0) return;

  // Dynamic scale — fit the scene to fill ~85% of canvas
  // Scene radius = ring radius + max tube length + small margin
  var tubeL  = gv('cordLength');
  var scale  = Math.min(W, H) * 1.1; // fixed scale — 1m = 110% of canvas short side

  var cx = W / 2;
  var cy = H / 2;

  // Ring center world position
  var rcx = Math.sin(ring.ax) * (gv('cordLength') * 0.30);
  var rcy = Math.sin(ring.ay) * (gv('cordLength') * 0.30);

  // To screen
  function wx(x) { return cx + x * scale; }
  function wy(y) { return cy + y * scale; }

  // Fixed mount point (ceiling)
  c.beginPath();
  c.arc(cx, cy, 4, 0, Math.PI*2);
  c.fillStyle = '#3a5040'; c.fill();

  // Housing cord
  c.beginPath();
  c.strokeStyle = 'rgba(100,130,110,0.4)';
  c.lineWidth = 1;
  c.moveTo(cx, cy);
  c.lineTo(wx(rcx), wy(rcy));
  c.stroke();

  // Ring
  var rPx = ringRadius * scale;
  c.beginPath();
  c.arc(wx(rcx), wy(rcy), rPx, 0, Math.PI*2);
  c.strokeStyle = 'rgba(180,162,140,0.5)';
  c.lineWidth = 2;
  c.stroke();

  // Clapper disc — compute position from physics state
  var dStrikerL = (gv('cordLength') * 0.76);
  var dScx = Math.sin(ring.ax) * (gv('cordLength') * 0.30) + Math.sin(striker.ax) * dStrikerL;
  var dScy = Math.sin(ring.ay) * (gv('cordLength') * 0.30) + Math.sin(striker.ay) * dStrikerL;
  c.beginPath();
  c.strokeStyle = 'rgba(160,148,130,0.4)';
  c.lineWidth = 0.8;
  c.moveTo(wx(rcx), wy(rcy));
  c.lineTo(wx(dScx), wy(dScy));
  c.stroke();
  var clapperR = Math.max(4, (ringRadius - TUBE_R - (gv('gap') / 1000)) * scale);
  c.beginPath();
  c.arc(wx(dScx), wy(dScy), clapperR, 0, Math.PI*2);
  c.fillStyle = '#c8b8a4';
  c.fill();
  c.strokeStyle = 'rgba(160,145,125,0.8)';
  c.lineWidth = 1.5; c.stroke();
  c.beginPath();
  c.arc(wx(dScx)-clapperR*0.3, wy(dScy)-clapperR*0.3, clapperR*0.35, 0, Math.PI*2);
  c.fillStyle = 'rgba(255,252,240,0.25)'; c.fill();



  // Tubes
  for (var i = 0; i < n; i++) {
    var t = tubes[i];
    var tLen = gv('cordLength') * t.lenFactor;
    var mountAngle = (i / n) * Math.PI * 2; // kept for compat
    var mx = t._mx !== undefined ? t._mx : rcx + (i/Math.max(1,n-1)-0.5)*ringRadius*2;
    var my = rcy;
    var mountAngle = (i / n) * Math.PI * 2;
    var mx = rcx + Math.cos(mountAngle) * ringRadius;
    var my = rcy + Math.sin(mountAngle) * ringRadius;
    var radX = -Math.cos(mountAngle), radY = -Math.sin(mountAngle);
    var tanXd = -Math.sin(mountAngle), tanYd = Math.cos(mountAngle);
    var tx   = t._tx   !== undefined ? t._tx   : mx + Math.sin(t.ta)*tLen*radX + Math.sin(t.tt)*tLen*tanXd;
    var ty   = t._ty   !== undefined ? t._ty   : my + Math.sin(t.ta)*tLen*radY + Math.sin(t.tt)*tLen*tanYd;
    var midX = t._midX !== undefined ? t._midX : mx + Math.sin(t.ta)*(tLen*0.5)*radX + Math.sin(t.tt)*(tLen*0.5)*tanXd;
    var midY = t._midY !== undefined ? t._midY : my + Math.sin(t.ta)*(tLen*0.5)*radY + Math.sin(t.tt)*(tLen*0.5)*tanYd;

    var flash = strikeFlash[i] || 0;

    // Cord from mount to tube
    c.beginPath();
    c.strokeStyle = flash > 0.05 ? 'rgba(140,200,150,0.5)' : 'rgba(160,148,130,0.4)';
    c.lineWidth = 0.8;
    c.moveTo(wx(mx), wy(my));
    c.lineTo(wx(tx), wy(ty));
    c.stroke();

    // Mount dot on ring
    c.beginPath();
    c.arc(wx(mx), wy(my), 2.5, 0, Math.PI*2);
    c.fillStyle = '#8a7a6a'; c.fill();

    // Tube circle drawn at midpoint — matches physical collision boundary
    var r = Math.max(4, TUBE_R * scale);
    c.beginPath();
    c.arc(wx(midX), wy(midY), r, 0, Math.PI*2);
    var absFlash = Math.abs(flash);
    var isCollision = flash < -0.01;
    var isClapperHit = flash > 0.01;
    if (isCollision) {
      // Red — tube hit another tube
      c.fillStyle = 'rgba(' + Math.round(180+absFlash*70) + ',80,80,0.95)';
    } else if (isClapperHit) {
      // Green — tube hit clapper
      c.fillStyle = 'rgba(' + Math.round(80+absFlash*150) + ',' + Math.round(160+absFlash*80) + ',80,0.95)';
    } else {
      c.fillStyle = 'rgba(140,128,112,0.9)';
    }
    c.fill();
    c.beginPath();
    c.arc(wx(midX)-r*0.3, wy(midY)-r*0.3, r*0.4, 0, Math.PI*2);
    c.fillStyle = 'rgba(255,252,240,' + (0.08 + absFlash*0.25) + ')';
    c.fill();
  }

  // Wind arrow
  var wMag = Math.sqrt(windX*windX + windY*windY);
  if (wMag > 0.01) {
    var wScale = 30 * Math.min(1, wMag / Math.max(0.1, gv('windStrength')));
    c.beginPath();
    c.strokeStyle = 'rgba(122,200,154,0.4)';
    c.lineWidth = 1.5;
    c.moveTo(20, 20);
    c.lineTo(20 + (windX/wMag)*wScale, 20 + (windY/wMag)*wScale);
    c.stroke();
  }
}

// ── Playback ──────────────────────────────────────────────
function start() {
  if (running) return;
  running = true;
  physTimer = setInterval(tick, Math.round(DT * 1000));
}

function stop() {
  running = false;
  clearInterval(physTimer);
  clearTimeout(windTimer); windTimer = null;
  windOn = false; windX = 0; windY = 0;
  // Leave source selection, ring state, and motion listener intact.
  // The ring settles naturally via damping; no hard reset.
  draw();
}
</script>
</body>
</html>
