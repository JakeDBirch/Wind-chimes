<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0c0e">
<title>Pocket Chimes</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0b0c0e; color: #c8d0c8; font-family: 'Courier New', monospace; font-size: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.app { padding: 18px; padding-top: calc(18px + env(safe-area-inset-top)); padding-left: calc(18px + env(safe-area-inset-left)); padding-right: calc(18px + env(safe-area-inset-right)); padding-bottom: calc(100px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; }
h1 { font-size: 11px; letter-spacing: 0.28em; color: #7ac89a; margin-bottom: 3px; text-transform: uppercase; }
.sub { font-size: 9px; color: #304838; letter-spacing: 0.15em; margin-bottom: 14px; }
canvas { display: block; width: 100%; height: 340px; background: #0e1210; border: 1px solid #1a2a1e; border-radius: 6px; margin-bottom: 14px; }
.section { margin-bottom: 16px; border-left: 1px solid #1a2a1e; padding-left: 12px; }
.stitle { font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase; color: #7ac89a; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.label { width: 130px; flex-shrink: 0; font-size: 9px; color: #4a7058; }
.val { width: 48px; text-align: right; flex-shrink: 0; font-size: 10px; color: #7ac89a; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; -webkit-appearance: none; height: 2px; background: #1a2a1e; border-radius: 1px; outline: none; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #0b0c0e; border: 1.5px solid #7ac89a; }
.schip { padding: 4px 9px; border-radius: 4px; border: 1px solid #1e2e22; background: none; color: #4a7060; font-family: 'Courier New', monospace; font-size: 9px; cursor: pointer; outline: none; transition: all 0.15s; letter-spacing: 0.05em; }
.schip.active { border-color: #7ac89a; color: #7ac89a; background: rgba(122,200,154,0.08); }
.float-bar { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(11,12,14,0.96); border: 1px solid #1a2a1e; border-radius: 10px; padding: 10px 14px; z-index: 100; }
.fbtn { padding: 9px 16px; border-radius: 6px; border: 1px solid #7ac89a; background: rgba(122,200,154,0.07); color: #7ac89a; font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 0.16em; cursor: pointer; outline: none; text-transform: uppercase; }
.fbtn:active { opacity: 0.6; }
.fbtn.off { border-color: #c87a7a; color: #c87a7a; background: rgba(200,122,122,0.07); }
/* Source toggle — Wind / Phone segmented */
.seg { display: flex; border: 1px solid #2a3a2e; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.seg button { flex: 1; padding: 10px 0; background: none; border: none; color: #5a6a5e; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; outline: none; transition: 0.18s; }
.seg button.active { background: rgba(122,200,154,0.14); color: #aee3c4; }
.seg button:first-child { border-right: 1px solid #2a3a2e; }
.motion-status { font-size: 8px; letter-spacing: 0.08em; color: #556; margin-bottom: 4px; min-height: 11px; }
.readouts { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 9px; color: #304838; }
.readouts span { color: #7ac89a; }
/* Custom scale — one octave of keys, A to G# */
.keys { display: flex; gap: 3px; margin-top: 8px; margin-bottom: 4px; align-items: flex-start; }
.key { flex: 1; height: 38px; border-radius: 4px; border: 1px solid #1e2e22; background: none; color: #4a7060; font-family: 'Courier New', monospace; font-size: 8px; cursor: pointer; outline: none; padding: 0; }
.key.black { height: 28px; background: #0e1210; border-color: #15201a; color: #3a5044; }
.key.active { border-color: #7ac89a; color: #7ac89a; background: rgba(122,200,154,0.14); }
.hint { font-size: 8px; color: #304838; margin-top: 4px; letter-spacing: 0.05em; }
</style>
</head>
<body>
<div class="app">
  <h1>Pocket Chimes</h1>
  <div class="sub">2D pendulum system — top-down view</div>

  <canvas id="viz" width="680" height="680"></canvas>

  <div class="readouts">
    <div>wind <span id="r-wind">0.00</span></div>
    <div>strikes <span id="r-strikes">0</span></div>
  </div>

  <div class="section">
    <div class="stitle">Drive</div>
    <div class="seg">
      <button id="src-wind" class="active">Wind</button>
      <button id="src-phone">Phone</button>
    </div>
    <div class="motion-status" id="motion-status"></div>
  </div>

  <div class="section" id="wind-section">
    <div class="stitle">Wind</div>
    <div class="row">
      <span class="label">Strength</span>
      <input type="range" id="windStrength" min="0" max="100" step="1" value="50">
      <span class="val" id="v-windStrength">50</span>
    </div>
    <div class="row">
      <span class="label">Consistency</span>
      <input type="range" id="windConsistency" min="0" max="100" step="1" value="40">
      <span class="val" id="v-windConsistency">40</span>
    </div>
  </div>

  <div class="section">
    <div class="stitle">Chimes</div>
    <div class="row">
      <span class="label">Sensitivity</span>
      <input type="range" id="sensitivity" min="0" max="100" step="1" value="21">
      <span class="val" id="v-sensitivity">21</span>
    </div>
    <div class="row">
      <span class="label">Swing</span>
      <input type="range" id="swing" min="0" max="100" step="1" value="58">
      <span class="val" id="v-swing">58</span>
    </div>
    <div class="row">
      <span class="label">Chimes</span>
      <input type="range" id="tubeCount" min="3" max="12" step="1" value="6">
      <span class="val" id="v-tubeCount">6</span>
    </div>
    <div class="row">
      <span class="label">Register</span>
      <input type="range" id="register" min="-1" max="1" step="0.1" value="0">
      <span class="val" id="v-register">0</span>
    </div>
  </div>

  <div class="section">
    <div class="stitle">Scale</div>
    <div id="scale-chips" style="display:flex;flex-wrap:wrap;gap:5px;"></div>
    <div id="custom-keys" style="display:none;">
      <div class="keys" id="keys"></div>
      <div class="hint">Tap keys to choose the notes. Chimes take them low to high, then repeat an octave up.</div>
    </div>
  </div>
</div>

<div class="float-bar">
  <button class="fbtn off" id="btn-physics">Physics off</button>
  <button class="fbtn" id="btn-gust">Gust</button>
</div>

<script>
// Pocket Chimes runs its physics and sound natively (the ChimeEngine plugin), so it keeps
// chiming in the background and with the screen locked. This page is the controls and view.
var Engine = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ChimeEngine;

var TUBE_R = 0.035;       // tube radius in meters — matches ChimePhysics.tubeR
var CORD_LENGTH = 0.53;   // fixed, matches ChimeParams.cordLength
var GAP_MM = 15.25;       // fixed, matches ChimeParams.gap
var SCALE_NAMES = ['Pentatonic', 'Major Pent', 'Major', 'Minor', 'Dorian', 'Lydian', 'Mixolydian',
                   'Whole Tone', 'Blues', 'Hirajoshi', 'In Sen', 'Chord Seq', 'Custom'];
// Semitones above A, as the engine counts them
var KEY_NAMES = ['A', 'A#', 'B', 'C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#'];
var currentScale = 'Chord Seq';
var customScale = [0, 3, 5, 7, 10];
var physicsOn = false;
var source = 'wind'; // 'wind' | 'phone'
var S = null;        // latest engine state
var _userChangedAt = 0; // ignore engine state briefly after a tap, so an in-flight poll can't undo it

// ── Helpers ───────────────────────────────────────────────
function gv(id) { return parseFloat(document.getElementById(id).value); }
function sv(id) {
  var n = gv(id), el = document.getElementById('v-' + id);
  if (!el) return;
  if (id === 'register') el.textContent = (n > 0 ? '+' : '') + n.toFixed(1);
  else el.textContent = Math.round(n);
}

// Sliders are 0–100 on screen; map them onto the engine's ranges here
function sendParams() {
  if (!Engine) return;
  Engine.setParams({
    windStrength: 0.10 + gv('windStrength') / 100 * 0.40,
    windConsistency: gv('windConsistency') / 100,
    sensitivity: 0.1 + gv('sensitivity') / 100 * 1.9,
    swing: gv('swing') / 100,
    tubeCount: Math.round(gv('tubeCount')),
    register: gv('register'),
    scale: currentScale,
    customScale: customScale
  });
}

function makeChips(containerId, names, getCurrent, setCurrent) {
  var el = document.getElementById(containerId);
  names.forEach(function(name) {
    var b = document.createElement('button');
    b.className = 'schip' + (name === getCurrent() ? ' active' : '');
    b.textContent = name;
    b.addEventListener('click', function() {
      setCurrent(name);
      el.querySelectorAll('.schip').forEach(function(c) { c.classList.remove('active'); });
      b.classList.add('active');
      sendParams();
    });
    el.appendChild(b);
  });
}

function buildKeyboard() {
  var el = document.getElementById('keys');
  KEY_NAMES.forEach(function(name, semitone) {
    var b = document.createElement('button');
    b.className = 'key' + (name.length > 1 ? ' black' : '') + (customScale.indexOf(semitone) >= 0 ? ' active' : '');
    b.textContent = name;
    b.addEventListener('click', function() {
      var i = customScale.indexOf(semitone);
      if (i >= 0) customScale.splice(i, 1); else customScale.push(semitone);
      customScale.sort(function(a, b) { return a - b; });
      b.classList.toggle('active', i < 0);
      sendParams();
    });
    el.appendChild(b);
  });
}

window.addEventListener('load', function() {
  document.querySelectorAll('input[type=range]').forEach(function(el) {
    sv(el.id);
    el.addEventListener('input', function() {
      sv(el.id);
      sendParams();
      draw();
    });
  });

  makeChips('scale-chips', SCALE_NAMES,
    function() { return currentScale; },
    function(n) {
      currentScale = n;
      document.getElementById('custom-keys').style.display = n === 'Custom' ? 'block' : 'none';
    });
  buildKeyboard();

  document.getElementById('btn-gust').addEventListener('click', function() {
    _userChangedAt = Date.now();
    if (Engine) Engine.gust();
    showPhysics(true);
  });
  document.getElementById('btn-physics').addEventListener('click', function() {
    _userChangedAt = Date.now();
    showPhysics(!physicsOn);
    if (Engine) Engine.setPhysics({ on: physicsOn });
  });
  document.getElementById('src-wind').addEventListener('click', function() { chooseSource('wind'); });
  document.getElementById('src-phone').addEventListener('click', function() { chooseSource('phone'); });

  if (!Engine) {
    document.getElementById('motion-status').textContent = 'Open Pocket Chimes on your phone to play.';
  }
  sendParams();
  requestAnimationFrame(loop);
});

// ── Controls ──────────────────────────────────────────────
function showPhysics(on) {
  physicsOn = on;
  var btn = document.getElementById('btn-physics');
  btn.textContent = on ? 'Physics on' : 'Physics off';
  btn.classList.toggle('off', !on);
  btn.classList.toggle('on', on);
}

function showSource(src) {
  source = src;
  document.getElementById('src-wind').classList.toggle('active', src === 'wind');
  document.getElementById('src-phone').classList.toggle('active', src === 'phone');
  var status = document.getElementById('motion-status');
  if (src === 'wind') status.textContent = '';
  else if (S && S.motionAvailable === false) status.textContent = 'Motion sensors not available on this device.';
  else status.textContent = 'Active — shake or sway to chime.';
}

function chooseSource(src) {
  _userChangedAt = Date.now();
  showSource(src);
  if (src === 'phone') showPhysics(true); // the engine turns physics on with the phone
  if (Engine) Engine.setSource({ source: src });
}

// ── State polling + readouts ──────────────────────────────
var _polling = false;
function loop() {
  if (Engine && !_polling && document.visibilityState === 'visible') {
    _polling = true;
    Engine.getState().then(function(state) {
      _polling = false;
      S = state;
      if (Date.now() - _userChangedAt > 500) {
        if (S.physicsOn !== physicsOn) showPhysics(S.physicsOn);
        if (S.source !== source) showSource(S.source);
      }
      document.getElementById('r-wind').textContent = Math.sqrt(S.wind[0]*S.wind[0] + S.wind[1]*S.wind[1]).toFixed(3);
      document.getElementById('r-strikes').textContent = S.strikes;
      draw();
    }, function() { _polling = false; });
  }
  requestAnimationFrame(loop);
}

// ── Drawing ───────────────────────────────────────────────
function draw() {
  var canvas = document.getElementById('viz');
  var c = canvas.getContext('2d');
  var W = canvas.offsetWidth  > 0 ? canvas.offsetWidth  : canvas.parentElement.offsetWidth || 340;
  var H = canvas.offsetHeight > 0 ? canvas.offsetHeight : 340;
  canvas.width  = W;
  canvas.height = H;

  c.fillStyle = '#0e1210';
  c.fillRect(0, 0, W, H);

  if (!S) return;
  var n = S.ta.length;
  if (n === 0) return;

  var cord   = CORD_LENGTH;
  var scale  = Math.min(W, H) * 1.1; // fixed scale — 1m = 110% of canvas short side
  var cx = W / 2;
  var cy = H / 2;
  var ringRadius = S.ringRadius;

  // Ring center world position
  var rcx = Math.sin(S.ring[0]) * (cord * 0.30);
  var rcy = Math.sin(S.ring[1]) * (cord * 0.30);

  function wx(x) { return cx + x * scale; }
  function wy(y) { return cy + y * scale; }

  // Fixed mount point (ceiling)
  c.beginPath();
  c.arc(cx, cy, 4, 0, Math.PI*2);
  c.fillStyle = '#3a5040'; c.fill();

  // Housing cord
  c.beginPath();
  c.strokeStyle = 'rgba(100,130,110,0.4)';
  c.lineWidth = 1;
  c.moveTo(cx, cy);
  c.lineTo(wx(rcx), wy(rcy));
  c.stroke();

  // Ring
  c.beginPath();
  c.arc(wx(rcx), wy(rcy), ringRadius * scale, 0, Math.PI*2);
  c.strokeStyle = 'rgba(180,162,140,0.5)';
  c.lineWidth = 2;
  c.stroke();

  // Clapper disc
  var strikerL = cord * 0.76;
  var dScx = rcx + Math.sin(S.striker[0]) * strikerL;
  var dScy = rcy + Math.sin(S.striker[1]) * strikerL;
  c.beginPath();
  c.strokeStyle = 'rgba(160,148,130,0.4)';
  c.lineWidth = 0.8;
  c.moveTo(wx(rcx), wy(rcy));
  c.lineTo(wx(dScx), wy(dScy));
  c.stroke();
  var clapperR = Math.max(4, (ringRadius - TUBE_R - (GAP_MM / 1000)) * scale);
  c.beginPath();
  c.arc(wx(dScx), wy(dScy), clapperR, 0, Math.PI*2);
  c.fillStyle = '#c8b8a4';
  c.fill();
  c.strokeStyle = 'rgba(160,145,125,0.8)';
  c.lineWidth = 1.5; c.stroke();
  c.beginPath();
  c.arc(wx(dScx)-clapperR*0.3, wy(dScy)-clapperR*0.3, clapperR*0.35, 0, Math.PI*2);
  c.fillStyle = 'rgba(255,252,240,0.25)'; c.fill();

  // Tubes
  for (var i = 0; i < n; i++) {
    var ta = S.ta[i], tt = S.tt[i];
    var tLen = cord * S.lenFactor[i];
    var mountAngle = (i / n) * Math.PI * 2;
    var mx = rcx + Math.cos(mountAngle) * ringRadius;
    var my = rcy + Math.sin(mountAngle) * ringRadius;
    var radX = -Math.cos(mountAngle), radY = -Math.sin(mountAngle);
    var tanX = -Math.sin(mountAngle), tanY = Math.cos(mountAngle);
    var tx   = mx + Math.sin(ta)*tLen*radX + Math.sin(tt)*tLen*tanX;
    var ty   = my + Math.sin(ta)*tLen*radY + Math.sin(tt)*tLen*tanY;
    var midX = mx + Math.sin(ta)*(tLen*0.5)*radX + Math.sin(tt)*(tLen*0.5)*tanX;
    var midY = my + Math.sin(ta)*(tLen*0.5)*radY + Math.sin(tt)*(tLen*0.5)*tanY;

    var flash = S.flash[i] || 0;

    // Cord from mount to tube
    c.beginPath();
    c.strokeStyle = flash > 0.05 ? 'rgba(140,200,150,0.5)' : 'rgba(160,148,130,0.4)';
    c.lineWidth = 0.8;
    c.moveTo(wx(mx), wy(my));
    c.lineTo(wx(tx), wy(ty));
    c.stroke();

    // Mount dot on ring
    c.beginPath();
    c.arc(wx(mx), wy(my), 2.5, 0, Math.PI*2);
    c.fillStyle = '#8a7a6a'; c.fill();

    // Tube circle drawn at midpoint — matches physical collision boundary
    var r = Math.max(4, TUBE_R * scale);
    c.beginPath();
    c.arc(wx(midX), wy(midY), r, 0, Math.PI*2);
    var absFlash = Math.abs(flash);
    if (flash < -0.01) {
      // Red — tube hit another tube
      c.fillStyle = 'rgba(' + Math.round(180+absFlash*70) + ',80,80,0.95)';
    } else if (flash > 0.01) {
      // Green — tube hit clapper
      c.fillStyle = 'rgba(' + Math.round(80+absFlash*150) + ',' + Math.round(160+absFlash*80) + ',80,0.95)';
    } else {
      c.fillStyle = 'rgba(140,128,112,0.9)';
    }
    c.fill();
    c.beginPath();
    c.arc(wx(midX)-r*0.3, wy(midY)-r*0.3, r*0.4, 0, Math.PI*2);
    c.fillStyle = 'rgba(255,252,240,' + (0.08 + absFlash*0.25) + ')';
    c.fill();
  }

  // Wind arrow
  var windX = S.wind[0], windY = S.wind[1];
  var wMag = Math.sqrt(windX*windX + windY*windY);
  if (wMag > 0.01) {
    var wScale = 30 * Math.min(1, wMag / (0.10 + gv('windStrength') / 100 * 0.40));
    c.beginPath();
    c.strokeStyle = 'rgba(122,200,154,0.4)';
    c.lineWidth = 1.5;
    c.moveTo(20, 20);
    c.lineTo(20 + (windX/wMag)*wScale, 20 + (windY/wMag)*wScale);
    c.stroke();
  }
}
</script>
</body>
</html>
